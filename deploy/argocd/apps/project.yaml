apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mvrca
  namespace: openshift-gitops
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/multivendor-agentic-rca.git
