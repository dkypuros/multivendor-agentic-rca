# Red Hat Connectivity Link. Required DSC precondition for LLMInferenceService
# (KserveLLMInferenceServiceDependencies). AllNamespaces operator → openshift-operators.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
