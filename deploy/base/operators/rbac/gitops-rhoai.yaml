# OpenShift GitOps can only get/list/watch cluster-scoped CRs by default.
# DSC and DSCI are cluster-scoped; without this binding Argo cannot create
# default-dsc and the dashboard never appears.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mvrca-rhoai-edit
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: ["datasciencecluster.opendatahub.io"]
    resources: ["datascienceclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["dscinitialization.opendatahub.io"]
    resources: ["dscinitializations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mvrca-rhoai-edit
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mvrca-rhoai-edit
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
