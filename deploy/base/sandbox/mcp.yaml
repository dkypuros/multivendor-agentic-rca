# MCP gateway + the four "plane" MCP servers the NEP orchestrator fans out to.
# The gateway validates the CAPIF token and routes tool calls by name (gateway-policy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  labels: { app: mcp-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-gateway }
  template:
    metadata:
      labels: { app: mcp-gateway }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gateway
          image: mvrca
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          command: ["python3", "-m", "extensions.sheldon.agentic.gateway",
                    "--host", "0.0.0.0", "--port", "8800", "--policy", "/etc/gateway/gateway-policy.yaml"]
          ports: [{ name: http, containerPort: 8800 }]
          readinessProbe:
            tcpSocket: { port: 8800 }
            periodSeconds: 10
          volumeMounts: [{ name: policy, mountPath: /etc/gateway }]
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: policy
          configMap: { name: gateway-policy }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
spec:
  selector: { app: mcp-gateway }
  ports: [{ name: http, port: 8800, targetPort: 8800 }]
---
