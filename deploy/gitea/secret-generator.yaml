# Generates gitea-admin-credentials (username, password, secret_key, internal_token) at
# apply time instead of committing fixed values to a public repo. Idempotent: if the Secret
# already exists (re-apply, or re-running the install), it's left alone. Scoped to exactly
# "get, create" on Secrets in the gitea namespace -- nothing cluster-scoped, nothing that
# can read or modify any other namespace's secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-secret-generator
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-secret-generator
  namespace: gitea
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-secret-generator
  namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitea-secret-generator
subjects:
  - kind: ServiceAccount
    name: gitea-secret-generator
    namespace: gitea
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-secret-generator
  namespace: gitea
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gitea-secret-generator
      containers:
        - name: generate
          # Same image already used elsewhere in this kustomization (wait-for-gitea,
          # create-repo) -- no new image dependency. Talks to the Kubernetes API
          # directly with the pod's own ServiceAccount token; no oc/kubectl binary needed.
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              APISERVER=https://kubernetes.default.svc
              TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              AUTH="Authorization: Bearer $(cat "$TOKEN_FILE")"

              if curl -fsS --cacert "$CACERT" -H "$AUTH" \
                   "$APISERVER/api/v1/namespaces/gitea/secrets/gitea-admin-credentials" >/dev/null 2>&1; then
                echo "gitea-admin-credentials already exists, leaving it alone"
                exit 0
              fi

              rand() { tr -dc 'A-Za-z0-9' < /dev/urandom | head -c "$1"; }
              b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

              PASSWORD="$(rand 20)Aa1!"
              SECRET_KEY="$(rand 64)"
              INTERNAL_TOKEN="$(rand 64)"

              BODY=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"gitea-admin-credentials"},"type":"Opaque","data":{"username":"%s","password":"%s","secret_key":"%s","internal_token":"%s"}}' \
                "$(b64 gitadmin)" "$(b64 "$PASSWORD")" "$(b64 "$SECRET_KEY")" "$(b64 "$INTERNAL_TOKEN")")

              curl -fsS --cacert "$CACERT" -H "$AUTH" -H 'Content-Type: application/json' \
                -X POST "$APISERVER/api/v1/namespaces/gitea/secrets" -d "$BODY"
              echo "gitea-admin-credentials created"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
