# MCP gateway policy. The NEP orchestrator presents a CAPIF-issued bearer token
# (3GPP TS 29.222); the gateway checks issuer + expiry and maps the token's API scope
# to the tool list below, then routes each tool call to its plane's MCP server.
# Lab fidelity: CAPIF tokens are unsigned and not signature-checked. The NetworkPolicy in
# networkpolicy.yaml is what keeps callers outside this namespace away from these services.
# The gateway reads this file at startup: after editing, `oc rollout restart deploy/mcp-gateway`.
tokenVerification:
  mode: capif
  capifIssuer: capif-core
capifScopeMap:
  # Read-only evidence tools the RCA agent calls. The O-Cloud *action* tools (power, reprovision)
  # are deliberately out of scope.
  mcp-tools:  ["ocloud_cluster_health", "ran_gnb_status", "ptp_operator_status", "nic_timestamp_counters"]
backends:
  - {name: ocloud, url: "http://mcp-ocloud:8850"}
  - {name: ran,    url: "http://mcp-ran:8851"}
  - {name: intel,  url: "http://mcp-intel:8852"}
  - {name: redhat, url: "http://mcp-redhat:8853"}
routes:
  - {match: "ocloud_*", backend: ocloud}
  - {match: "ran_*",    backend: ran}
  - {match: "nic_*",    backend: intel}
  - {match: "ptp_*",    backend: redhat}
